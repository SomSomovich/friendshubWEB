syntax = "proto3";

package fh;

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message Envelope {
  bytes envelope_id = 1;
  bytes sender_account_id = 2;
  uint32 sender_device_number = 3;
  bytes recipient_account_id = 4;
  uint32 recipient_device_number = 5;
  EnvelopeType envelope_type = 6;
  bool is_prekey_message = 7;
  bytes ciphertext = 8;
  int64 client_timestamp = 9;
  bytes conversation_id = 10;
  bool sender_is_bot = 11;
  // Non-zero: deliver at this unix time. Zero: deliver now.
  // Set by the client, bounded by the server to now + 24h.
  // A zero means the message is not scheduled.
  int64 send_at = 12;
}

enum EnvelopeType {
  ENVELOPE_TYPE_UNSPECIFIED = 0;
  ENVELOPE_TYPE_MESSAGE = 1;
  ENVELOPE_TYPE_SYNC = 2;
  ENVELOPE_TYPE_SENDER_KEY = 3;
  ENVELOPE_TYPE_EDIT = 4;
  ENVELOPE_TYPE_DELETE = 5;
  ENVELOPE_TYPE_REACTION = 6;
  ENVELOPE_TYPE_READ_RECEIPT = 7;
  ENVELOPE_TYPE_TYPING = 8;
  ENVELOPE_TYPE_ATTACHMENT_KEY = 9;
  ENVELOPE_TYPE_CALL_OFFER = 10;
  ENVELOPE_TYPE_CALL_ANSWER = 11;
  ENVELOPE_TYPE_CALL_ICE = 12;
  ENVELOPE_TYPE_CALL_HANGUP = 13;
  ENVELOPE_TYPE_CALL_REJECT = 14;
  ENVELOPE_TYPE_BOT_MESSAGE = 15;

  // 16 and 17 were ENVELOPE_TYPE_PIN and ENVELOPE_TYPE_UNPIN. Pins are
  // conversation state, not messages one device sends to another, and
  // they are now managed through REST. The numbers are reserved rather
  // than reused so an old client that still emits them cannot be
  // silently interpreted as a different type.
  reserved 16, 17;
}

message ClientFrame {
  oneof kind {
    ClientHello hello = 1;
    EnvelopeUpload upload = 2;
    EnvelopeAck ack = 3;
    Ping ping = 4;
    TypingFrame typing = 5;
    HistoryRequest history_request = 6;
    Nudge nudge = 7;
  }
}

message ClientHello {
  string session_token = 1;
  uint32 device_number = 2;
  uint32 protocol_major = 3;
  uint32 protocol_minor = 4;
  uint32 protocol_patch = 5;
  string client_name = 6;
  string client_version = 7;
}

message EnvelopeUpload {
  repeated Envelope envelopes = 1;
}

message EnvelopeAck {
  repeated bytes envelope_ids = 1;
  // Filled only by the server, in the same order as nvelope_ids.
  // A client ack never sets it: the client does not know the server
  // timestamp of the envelopes it is acknowledging.
  repeated int64 server_timestamps = 2;
}

message Ping {
  uint64 client_timestamp = 1;
}

message ServerFrame {
  oneof kind {
    ServerHello hello = 1;
    EnvelopeDelivery delivery = 2;
    EnvelopeAck receipt = 3;
    Pong pong = 4;
    ErrorFrame error = 5;
    PresenceUpdate presence = 6;
    BotMessageDelivery bot_message = 7;
    ChannelPostDelivery channel_post = 8;
    TypingDelivery typing = 9;
    ReadReceiptDelivery read_receipt = 10;
    ConversationUpdatedDelivery conversation_updated = 11;
    HistoryRequestRelay history_request_relay = 12;
    NudgeDelivery nudge = 13;
    NudgeResult nudge_result = 14;
    ConversationExpiredDelivery conversation_expired = 15;
    ScheduledEnvelopeCreated scheduled_created = 16;
    ScheduledEnvelopeCancelled scheduled_cancelled = 17;
    FoldersUpdated folders_updated = 18;
  }
}

message ServerHello {
  string session_id = 1;
  bytes account_id = 2;
  uint32 device_number = 3;
  uint64 server_timestamp = 4;
  uint32 protocol_major = 5;
  uint32 protocol_minor = 6;
  uint32 protocol_patch = 7;
}

message EnvelopeDelivery {
  repeated Envelope envelopes = 1;
}

message Pong {
  uint64 client_timestamp = 1;
  uint64 server_timestamp = 2;
}

message ErrorFrame {
  string code = 1;
  string message = 2;
  bool fatal = 3;
}

message PresenceUpdate {
  bytes account_id = 1;
  bool is_online = 2;
  optional int64 last_seen = 3;
  optional string custom_status_text = 4;
  optional string custom_status_emoji = 5;
  optional int64 custom_status_expires_at = 6;
}

message BotMessageDelivery {
  string message_id = 1;
  bytes bot_id = 2;                // UUID
  bytes account_id = 3;            // UUID (the human user)
  string text = 4;
  optional string reply_to_message_id = 5;
  int64 created_at = 6;
}

message ChannelPostDelivery {
  string post_id = 1;
  bytes channel_id = 2;
  string author_type = 3;
  bytes author_id = 4;
  string text = 5;
  repeated string attachment_ids = 6;
  optional string reply_to_post_id = 7;
  int64 created_at = 8;
}

message TypingFrame {
  bytes conversation_id = 1;
}

message TypingDelivery {
  bytes conversation_id = 1;
  bytes account_id = 2;
}

message ReadReceiptDelivery {
  bytes conversation_id = 1;
  bytes account_id = 2;
  int64 last_read_at = 3;
}

// Metadata of a group or channel changed, or its member list changed.
// Fields are the current values, not a delta: a client that missed an
// earlier frame still ends up consistent after any later one.
message ConversationUpdatedDelivery {
  bytes conversation_id = 1;
  optional string title = 2;
  optional string description = 3;
  optional bool is_public = 4;
  bool members_changed = 5;
}
// History sync between two devices of the same account.
//
// `HistoryRequest` travels from a newly registered device that has no
// local history to an older device that does. The server validates that
// `target_device_number` names another active device of the sender's
// account and that every conversation id in the list is one the sender
// is a member of, then relays the request as `HistoryRequestRelay`.
//
// The relayed frame carries only the request: the actual history is
// sent back as ordinary `Envelope`s, addressed by the old device to the
// new one, and encrypted with the sessions the old device establishes
// for the new. The server neither reads nor stores any of it beyond the
// normal envelope path.

message HistoryRequest {
  uint32 target_device_number = 1;
  repeated bytes conversation_ids = 2;
}

message HistoryRequestRelay {
  uint32 from_device_number = 1;
  repeated bytes conversation_ids = 2;
}
// Nudge: a "shake" sent from one account to another inside a direct
// conversation. Relayed, never stored. The target can opt out via the
// `allow_nudges` flag on their account, in which case the sender's
// request is refused without notification to the target.

message Nudge {
  bytes conversation_id = 1;
  bytes target_account_id = 2;
}

message NudgeDelivery {
  bytes conversation_id = 1;
  bytes from_account_id = 2;
}

message NudgeResult {
  bool delivered = 1;
}

// Sent to all live members of a temporary room when the cleanup worker
// deletes it. The client is expected to remove the conversation and its
// local messages; a client that does not is outside the server's reach.

message ConversationExpiredDelivery {
  bytes conversation_id = 1;
}

// Signals that a new scheduled envelope has been queued, or that one
// has been cancelled. Sent only to the sender's other devices.

message ScheduledEnvelopeCreated {
  bytes envelope_id = 1;
  bytes conversation_id = 2;
  int64 send_at = 3;
}

message ScheduledEnvelopeCancelled {
  bytes envelope_id = 1;
}

// Sent to a device when the same account's folders change on another
// device. Carries no data: the client re-fetches `GET /folders`.

message FoldersUpdated {
  bytes account_id = 1;
}
